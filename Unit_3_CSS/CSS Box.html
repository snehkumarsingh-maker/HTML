<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Box Model Demo</title>
    <style>
        .card {
            width: 350;
            padding: 30px;
            border: 4px solid;
            margin: 40px auto;
            background-color: aliceblue;
            text-align: center;
            border-radius: 12px;
            box-shadow: 2px 4px 8px rgb(red green blue / alpha);
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="card ">
        <h2> Hello class!</h2>
    </div> 
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Page </title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: white;
            font-family: Georgia, serif;
        }

        .box {
            background-color: #f27b72;
            border: 7px solid #d8a800;
            padding: 22px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 30px;
            font-weight: bold;
            color: #222;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 30px;
            color: #222;
        }

        p {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0;
            color: #222;
        }

        .highlight {
            background-color: #b878e8;
            color: white;
            padding: 3px 8px;
        }
    </style>
</head>

<body>

    <!-- Student Information -->
    <div class="box">
        <h1>Student Information</h1>

        <p>
            Name:
            <span class="highlight">Sneh Kumar singh </span>
        </p>

        <p>
            Department:
            <span class="highlight">Computer Science and engineering </span>
        </p>
    

        <p>
            Year: 1st Year
        </p>
    </div>

    <!-- Hobbies -->
    <div class="box">
        <h2>Hobbies</h2>

        <p>
            <span class="highlight">I am intrested in Physics and mathematics </span>,
            <span class="highlight">Solving problems </span>,
            and
            <span class="highlight">Traveling</span>
        </p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>
            Form Types
        </title>
    </head>
    <body>
        <form>
            <fieldset>
               
               <legend>  Student form</legend>
            
            <label> Name: </label>
            <input type = "text">
            <br> <br>
            <label> Age: </label>
            <input type = "number">
            <br> <br>
            <label> Date of Birth: </label>
            <input type = "date">
            <br> <br>
            <label> Time: </label>
            <input type = "time">
            <br> <br>
            <label> Upload Photo: </label>
            <input type = "file">
            <br> <br>
            <label> Gender: </label>
            <input type = "radio" name ="gender"> Male
            <input type = "radio" name ="gender"> Female
            <br> <br>
            <label> Hobies: </label>
            <input type = "checkbox"> Football
            <input type = "checkbox"> Cricket
            <input type = "checkbox"> Python
            <input type = "checkbox"> Hockey
            <br> <br>
            </fieldset>
        </form>
    </body>
</html>
